# The official standalone_embed.sh settings adapted to an isolated Compose project:
# https://github.com/milvus-io/milvus/blob/v2.5.27/scripts/standalone_embed.sh
name: freshqa-hw2
services:
  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    cpus: 2
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      GOMAXPROCS: "2"
      OMP_NUM_THREADS: "2"
    ports:
      - "127.0.0.1:19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    configs:
      - source: embedded_etcd
        target: /milvus/configs/embedEtcd.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 3

volumes:
  milvus_data:

configs:
  embedded_etcd:
    content: |
      listen-client-urls: http://127.0.0.1:2379
      advertise-client-urls: http://127.0.0.1:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: "1000"
